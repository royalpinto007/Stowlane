name: Feature request
description: Suggest an improvement.
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you are in, not the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true
  - type: checkboxes
    id: offline
    attributes:
      label: Offline check
      options:
        - label: This works with no network connection, or I have explained below why it cannot.
