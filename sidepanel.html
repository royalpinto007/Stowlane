<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stowlane</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div id="app">
      <header class="bar">
        <div class="brand">
          <img src="icons/icon-32.png" alt="" width="22" height="22" />
          <span>Stowlane</span>
          <span class="count" id="count" aria-live="polite"></span>
        </div>
        <button id="settings-btn" class="icon-btn" aria-label="Settings" title="Settings">⚙</button>
      </header>

      <div class="toolbar">
        <button id="stow-btn" class="primary">Stow this window</button>
        <label class="toggle keep">
          <input type="checkbox" id="keep-open" />
          <span>Keep tabs open</span>
        </label>
        <div class="filters">
          <input
            id="search"
            type="search"
            placeholder="Search lanes and tabs"
            aria-label="Search lanes and tabs"
            autocomplete="off"
          />
          <select id="sort" aria-label="Sort order">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="largest">Most tabs</option>
            <option value="name">Name</option>
          </select>
          <label class="toggle">
            <input type="checkbox" id="starred-only" />
            <span>Starred</span>
          </label>
        </div>
      </div>

      <main id="list" class="list" aria-live="polite"></main>

      <section id="settings" class="settings" hidden>
        <div class="panel-bar">
          <button id="settings-back" class="icon-btn" aria-label="Back">←</button>
          <strong>Settings</strong>
        </div>
        <div class="settings-body">
          <p class="muted" id="storage-line"></p>
          <div class="settings-row">
            <button id="export-btn" class="ghost">Export backup</button>
            <button id="import-btn" class="ghost">Import backup</button>
            <input type="file" id="import-file" accept="application/json" hidden />
          </div>
          <button id="clear-btn" class="ghost danger">Delete every lane</button>
          <p class="muted small">
            Stowlane makes no network requests. Your lanes stay in this browser profile and are
            never uploaded, so a backup file is the only way to move them.
          </p>
        </div>
      </section>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="dist/sidepanel.js"></script>
  </body>
</html>
